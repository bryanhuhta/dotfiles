# Repo-wide template data (tracked, unlike the machine-local chezmoi.toml).

[markeditPreview]
    # Release tag (without the "v" prefix) from
    # https://github.com/MarkEdit-app/MarkEdit-preview/tags.
    # Bump this and run `chezmoi apply` to upgrade the extension.
    version = "1.8.1"

[nvm]
    # Release tag (without the "v" prefix) from
    # https://github.com/nvm-sh/nvm/releases.
    # Bump this and run `chezmoi apply` to upgrade nvm.
    version = "0.40.6"

[node]
    # Node.js version installed and set as the nvm default by
    # run_onchange_after_install-node.py.
    # Bump this and run `chezmoi apply` to install the new version.
    version = "24.18.1"

    # npm packages installed globally into the pinned version by that same
    # script. nvm scopes globals to a single Node.js version, so bumping
    # `version` above re-runs the script and reinstalls these into the new
    # version's bin directory.
    globals = [
        "typescript",                   # tsserver, which ts_ls wraps
        "typescript-language-server",   # TypeScript/JavaScript language server
    ]
