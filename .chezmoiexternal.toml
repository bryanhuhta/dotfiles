{{- if eq .profile "work" }}
# MarkEdit preview extension, pinned via .chezmoidata.toml. The URL embeds the
# version, so bumping it re-downloads on the next apply. The extension's own
# update checks are disabled in MarkEdit's settings.json.
["Library/Containers/app.cyan.markedit/Data/Documents/scripts/markedit-preview.js"]
    type = "file"
    url = "https://raw.githubusercontent.com/MarkEdit-app/MarkEdit-preview/v{{ .markeditPreview.version }}/dist/markedit-preview.js"
{{- end }}

